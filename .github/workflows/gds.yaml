name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26c
        with:
          pdk: sky130A

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Patch only the upstream XML success check for cocotb 2.x.
      - name: Checkout gate-level action
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: 85a4c4128c10aa024ea8a02c7b3828d11c14ed90
          path: .tt-gds-action

      - name: Fix gate-level XML result check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.tt-gds-action/gl_test/action.yml')
          text = p.read_text()
          old = '! grep failure results.xml'
          new = """python -c "import xml.etree.ElementTree as E; r=E.parse('results.xml').getroot(); suites=list(r.iter('testsuite')); assert suites and list(r.iter('testcase')); assert not list(r.iter('failure')) and not list(r.iter('error')); assert all(int(s.get('failures', 0))==0 and int(s.get('errors', 0))==0 for s in suites)" """
          assert text.count(old) == 1
          p.write_text(text.replace(old, new.rstrip()))
          PY

      - name: GL test
        uses: ./.tt-gds-action/gl_test

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26c
